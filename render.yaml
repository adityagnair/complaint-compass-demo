services:
  - type: web
    name: complaint-compass-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-demo.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: OLLAMA_LABELS
        value: "false"
