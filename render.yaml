services:
  - type: web
    name: complaint-compass-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: WORKSPACE_AUTH_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://complaint-compass-demo.vercel.app"
      - key: OLLAMA_LABELS
        value: "false"
      - key: OLLAMA_SEVERITY
        value: "true"
      - key: OLLAMA_BASE_URL
        sync: false
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
      - key: INTAKE_WEBHOOK_TOKEN
        sync: false
      - key: WORKSPACE_ACCESS_TOKEN
        sync: false
